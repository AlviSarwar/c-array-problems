name: Compile check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every C file
        run: |
          for f in *.c; do
            echo "Checking $f"
            gcc -Wall -fsyntax-only "$f"
          done